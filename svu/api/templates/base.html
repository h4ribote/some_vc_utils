<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Some VC Utils{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Some VC Utils</a>
    {% if viewer %}
    <nav class="nav">
      <a href="/">サーバー</a>
      <a href="/me">個人設定</a>
      {% if viewer.is_admin %}<a href="/admin">管理</a>{% endif %}
      <span class="who">
        {% if viewer.session.avatar %}<img class="avatar" src="https://cdn.discordapp.com/avatars/{{ viewer.session.user_id }}/{{ viewer.session.avatar }}.png?size=64" alt="">{% endif %}
        {{ viewer.session.username }}
      </span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button type="submit" class="link">ログアウト</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="page">
    {% if flash %}<div class="flash flash-{{ flash.level }}">{{ flash.message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <a href="https://github.com/h4ribote/some_vc_utils">GitHub</a> · <a href="https://discord.gg/rqpSGFSRUH">サポートサーバー</a>
  </footer>
</body>
</html>
