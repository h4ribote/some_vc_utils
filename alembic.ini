# Developer entry point for the alembic command; the application builds its Alembic config in svu/db/migrate.py.
# The database URL comes from the SVU_DB_* settings unless sqlalchemy.url is set below.

[alembic]
script_location = %(here)s/svu/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
