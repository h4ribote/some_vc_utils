[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "svu"
dynamic = ["version"]
description = "Some VC Utils: a Discord bot, webhook receiver, dashboard and worker built on VirtualCrypto."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "discord.py>=2.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
svu = "svu.cli:main"

[tool.setuptools.dynamic]
version = { attr = "svu.__version__" }

[tool.setuptools.packages.find]
include = ["svu*"]

[tool.setuptools.package-data]
svu = ["py.typed", "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py", "api/templates/*.html", "api/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 200
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
# One sentence per physical line is the project's comment rule, so line length is not linted; assert narrows types for invariants the surrounding code establishes.
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["svu", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a PostgreSQL database (a throwaway docker container unless SVU_TEST_DB_URL is set)"]
# discord.py imports audioop for voice, which this bot does not use.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
